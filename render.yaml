services:
  - type: web
    name: schedule-system-new
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: schedule-db
          property: connectionString

databases:
  - name: schedule-db
    databaseName: schedule
    user: schedule_user
    plan: free